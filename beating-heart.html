<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trái tim đập</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="heart-canvas"></canvas>
<script>
(function () {
  const canvas = document.getElementById("heart-canvas");
  const ctx = canvas.getContext("2d");
  let width, height, centerX, centerY, scaleBase;

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    centerX = width / 2;
    centerY = height / 2;
    scaleBase = Math.min(width, height) / 32;
  }
  window.addEventListener("resize", resize);
  resize();

  // Phương trình tham số hình trái tim
  function heartPoint(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
    return { x, y };
  }

  // Sinh các điểm mục tiêu: viền tim + các điểm rải rác bên trong
  function buildTargets() {
    const targets = [];

    // Viền
    const outlineCount = 220;
    for (let i = 0; i < outlineCount; i++) {
      const t = (i / outlineCount) * Math.PI * 2;
      targets.push({ ...heartPoint(t), edge: true });
    }

    // Bên trong (co điểm viền về tâm với hệ số ngẫu nhiên)
    const fillCount = 500;
    for (let i = 0; i < fillCount; i++) {
      const t = Math.random() * Math.PI * 2;
      const shrink = Math.pow(Math.random(), 0.5); // dồn nhiều điểm ra gần viền hơn
      const p = heartPoint(t);
      targets.push({ x: p.x * shrink, y: p.y * shrink, edge: false });
    }

    return targets;
  }

  const targets = buildTargets();

  const particles = targets.map((target) => ({
    target,
    x: centerX + (Math.random() - 0.5) * width,
    y: centerY + (Math.random() - 0.5) * height,
    size: target.edge ? 2.2 + Math.random() * 1.3 : 1.2 + Math.random() * 1.6,
    hueShift: Math.random() * 20 - 10,
    settleSpeed: 0.04 + Math.random() * 0.04,
    wobble: Math.random() * Math.PI * 2,
  }));

  let startTime = null;

  // Nhịp đập kiểu "lub-dub": hai xung co giãn liên tiếp mỗi chu kỳ
  function beatScale(elapsed) {
    const cycle = 1.1; // giây / nhịp
    const t = (elapsed % cycle) / cycle;
    const lub = Math.exp(-Math.pow((t - 0.08) * 14, 2));
    const dub = Math.exp(-Math.pow((t - 0.28) * 14, 2)) * 0.6;
    return 1 + (lub + dub) * 0.18;
  }

  function tick(now) {
    if (startTime === null) startTime = now;
    const elapsed = (now - startTime) / 1000;

    // Vệt mờ dần thay vì xoá hẳn khung hình -> hiệu ứng glow đuôi
    ctx.fillStyle = "rgba(0, 0, 0, 0.18)";
    ctx.fillRect(0, 0, width, height);

    const scale = scaleBase * beatScale(elapsed);
    const settle = Math.min(1, elapsed / 1.6); // hội tụ vào hình tim trong ~1.6s đầu

    ctx.globalCompositeOperation = "lighter";

    particles.forEach((p) => {
      const tx = centerX + p.target.x * scale;
      const ty = centerY + p.target.y * scale;

      // Trong giai đoạn hội tụ: bay dần từ vị trí ngẫu nhiên vào đúng chỗ
      p.x += (tx - p.x) * (p.settleSpeed + settle * 0.06);
      p.y += (ty - p.y) * (p.settleSpeed + settle * 0.06);

      const hue = 340 + p.hueShift;
      const alpha = p.target.edge ? 0.9 : 0.55;

      const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 4);
      glow.addColorStop(0, `hsla(${hue}, 100%, 65%, ${alpha})`);
      glow.addColorStop(1, `hsla(${hue}, 100%, 55%, 0)`);

      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = `hsla(${hue}, 100%, 80%, ${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.globalCompositeOperation = "source-over";

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
