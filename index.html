<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lời mời hẹn hò</title>
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
  <canvas id="fx-canvas"></canvas>

  <div class="page">
    <div class="card center">

      <div id="view-question" class="view active">
        <h1 class="title" id="question-title"></h1>
        <p class="question" id="question-text"></p>
        <div class="buttons">
          <button type="button" id="btn-yes" class="btn btn-yes">Có 💖</button>
          <button type="button" id="btn-no" class="btn btn-no">Không</button>
        </div>
      </div>

      <div id="view-datetime" class="view">
        <h1 class="title">Để buổi hẹn có thể diễn ra 1 cách thuận lợi, em giúp anh hoàn thiện những thông tin này nhé.</h1>
        <p class="question" id="datetime-text"></p>
        <form id="form-datetime" class="datetime-form">
          <input type="text" id="input-datetime" class="datetime-input" placeholder="VD: Thứ 7, 20/09/2026 lúc 19:00" required>
          <button type="submit" class="btn btn-yes btn-wide">Tiếp theo →</button>
        </form>
      </div>

      <div id="view-activity" class="view">
        <h1 class="title">💭 Em muốn sau khi đi ăn xong thì mình sẽ đi đâu tiếp theo?</h1>
        <form id="form-activity" class="activity-form">
          <div id="activity-grid" class="option-grid"></div>
          <input type="text" id="input-activity-other" class="datetime-input other-activity-input" placeholder="Nhập hoạt động em muốn...">
          <button type="submit" class="btn btn-yes btn-wide">Xác nhận 💕</button>
        </form>
      </div>

      <div id="view-notes" class="view">
        <h1 class="title">📝 Em có muốn thêm gì hay yêu cầu gì không?</h1>
        <p class="question">Không bắt buộc, cứ để trống nếu không có nhé</p>
        <form id="form-notes" class="datetime-form">
          <textarea id="input-notes" class="datetime-input notes-input" rows="3" placeholder="VD: em muốn đi quán yên tĩnh, em không ăn cay..."></textarea>
          <button type="submit" class="btn btn-yes btn-wide">Xác nhận 💕</button>
        </form>
      </div>

      <div id="view-result" class="view">
        <h1 class="title"> Tuyệt vời!</h1>
        <p class="question" id="result-text"></p>
        <div class="summary">
          <p><strong>🕒 Thời gian:</strong> <span id="result-datetime"></span></p>
          <p><strong id="result-activity-emoji"></strong> <span id="result-activity-label"></span></p>
          <p id="result-notes-row"><strong>📝 Yêu cầu thêm:</strong> <span id="result-notes"></span></p>
        </div>
        <p class="thanks" id="result-thanks"></p>
      </div>

    </div>
  </div>

  <audio id="bg-music" src="static/audio/love-song.mp3" loop autoplay></audio>
  <button id="music-toggle" type="button" title="Bật/tắt nhạc nền">🔇</button>

  <script src="static/js/config.js"></script>
  <script src="static/js/effects.js"></script>
  <script src="static/js/dodge.js"></script>
  <script src="static/js/app.js"></script>
</body>
</html>
