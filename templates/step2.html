{% extends "base.html" %}

{% block title %}Chọn khung giờ{% endblock %}

{% block content %}
<div class="card center">
  <h1 class="title">Để buổi hẹn có thể diễn ra 1 cách thuận lợi nhất, em giúp anh hoàn thành những câu hỏi này nhé.</h1>
  <p class="question">Chọn ngày giờ {{ config.girl_name }} rảnh nhé</p>

  <form method="post" class="datetime-form">
    <input type="text" name="datetime" class="datetime-input" placeholder="VD: Thứ 7, 20/09/2026 lúc 19:00" required>
    <button type="submit" class="btn btn-yes btn-wide">Tiếp theo →</button>
  </form>
</div>
{% endblock %}
